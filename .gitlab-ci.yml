stages:
    - prepare
    - check
    - build
    - deploy

# Deploy

connect:
    stage: deploy
    before_script:
        - "command -v ssh-agent >/dev/null || ( apk add --update openssh )"
        - eval $(ssh-agent -s)
        - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan $VPS_SERVER_ADDRESS >> ~/.ssh/known_hosts
        - chmod 644 ~/.ssh/known_hosts
    script:
        - ssh $VPS_USER_NAME@$VPS_SERVER_ADDRESS "cd /var/dev && ls -la"
    artifacts:
        paths:
            - public
